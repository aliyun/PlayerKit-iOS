<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>AliPlayerKit - iOS Player Components</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="AliPlayerKit iOS Player Components Documentation - Low-code Player UI Components & Scenario-based Solutions">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="_media/logo.png" type="image/png">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@latest/lib/themes/vue.css">
    <style>
        /* --- 1. Brand Color (iOS System Blue) --- */
        :root {
            --theme-color: #007AFF;
            --theme-color-dark: #0056CC;
        }

        /* --- 2. Dark Mode --- */
        :root {
            --dark-bg: #1c1c1e;
            --dark-text: #e5e5e7;
            --dark-sidebar: #1c1c1e;
            --dark-code-bg: #2c2c2e;
            --dark-border: #38383a;
        }

        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }

        body.dark-mode .sidebar {
            background-color: var(--dark-sidebar);
            border-right: 1px solid var(--dark-border);
            color: var(--dark-text);
        }
        body.dark-mode .sidebar-nav li a {
            color: #98989d;
        }
        body.dark-mode .sidebar-nav li a:hover {
            color: var(--theme-color);
        }
        body.dark-mode .sidebar-nav li.active > a {
            color: var(--theme-color);
            border-right: 2px solid var(--theme-color);
        }

        body.dark-mode pre {
            background-color: var(--dark-code-bg) !important;
        }
        body.dark-mode code {
            background-color: var(--dark-code-bg) !important;
            color: #e5e5e7 !important;
        }
        body.dark-mode .markdown-section code {
            color: #64d2ff;
            background-color: rgba(100, 210, 255, 0.1);
        }

        body.dark-mode .token.keyword,
        body.dark-mode .token.tag,
        body.dark-mode .token.selector {
            color: #ff7eb6 !important;
        }
        body.dark-mode .token.string,
        body.dark-mode .token.attr-value {
            color: #ff8170 !important;
        }
        body.dark-mode .token.function {
            color: #67b7a4 !important;
        }
        body.dark-mode .token.number,
        body.dark-mode .token.constant {
            color: #d0bf69 !important;
        }
        body.dark-mode .token.comment {
            color: #6c7986 !important;
        }

        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4 {
            color: #f5f5f7;
        }
        body.dark-mode blockquote {
            color: #98989d;
            background: rgba(255,255,255,0.05);
            border-left-color: var(--theme-color);
        }
        body.dark-mode .markdown-section a {
            color: #0a84ff;
        }

        body.dark-mode .markdown-section tr:nth-child(2n) {
            background-color: rgba(255,255,255,0.03);
        }
        body.dark-mode .markdown-section td,
        body.dark-mode .markdown-section th {
            border-color: var(--dark-border);
        }
        body.dark-mode table th {
            background: #2c2c2e;
            color: #f5f5f7;
        }

        body.dark-mode .mermaid {
            filter: invert(1) hue-rotate(180deg);
        }

        body.dark-mode .docsify-pagination-container {
            border-top-color: var(--dark-border);
        }
        body.dark-mode .pagination-item-label {
            color: #98989d;
        }

        /* --- 3. Sidebar Toggle Buttons --- */
        .sidebar-toggle-btn {
            cursor: pointer;
            display: block;
            text-align: center;
            padding: 10px 0;
            margin: 0 15px 10px 15px;
            font-weight: 500;
            font-size: 13px;
            border-radius: 8px;
            background-color: rgba(0, 122, 255, 0.08);
            color: #007AFF;
            border: 1px solid rgba(0, 122, 255, 0.2);
            transition: all 0.2s ease;
        }
        body.dark-mode .sidebar-toggle-btn {
            background-color: rgba(10, 132, 255, 0.15);
            color: #0a84ff;
            border: 1px solid rgba(10, 132, 255, 0.3);
        }
        .sidebar-toggle-btn:hover {
            background-color: var(--theme-color);
            color: white;
            border-color: var(--theme-color);
        }
    </style>
</head>

<body>
    <div id="app">Loading...</div>
    <script>
        // Initialize dark mode
        if (localStorage.getItem('theme-mode') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        window.$docsify = {
            name: '<img src="_media/logo.png" alt="AliPlayerKit" width="28" style="vertical-align:middle;margin-right:6px;border-radius:4px;"> AliPlayerKit',
            nameLink: {
                '/': '#/'
            },
            repo: '',
            loadSidebar: true,
            auto2top: true,
            subMaxLevel: 3,
            pagination: {
                previousText: 'Previous',
                nextText: 'Next',
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: 'Search',
                noData: 'No results',
                depth: 6
            },
            plugins: [
                // Dark mode toggle plugin
                function(hook, vm) {
                    hook.doneEach(function() {
                        const sidebar = document.querySelector('.sidebar-nav');
                        if (!sidebar || document.querySelector('.sidebar-toggle-btn-theme')) return;

                        const btn = document.createElement('div');
                        btn.className = 'sidebar-toggle-btn sidebar-toggle-btn-theme';

                        const savedTheme = localStorage.getItem('theme-mode');
                        if (savedTheme === 'dark') {
                            document.body.classList.add('dark-mode');
                            btn.textContent = '🌙 Light Mode';
                        } else {
                            btn.textContent = '☀️ Dark Mode';
                        }

                        btn.onclick = function() {
                            document.body.classList.toggle('dark-mode');
                            const isDark = document.body.classList.contains('dark-mode');
                            localStorage.setItem('theme-mode', isDark ? 'dark' : 'light');
                            const isEnglish = isEnglishPath(getCurrentPath());
                            if (isEnglish) {
                                btn.textContent = isDark ? '🌙 Light Mode' : '☀️ Dark Mode';
                            } else {
                                btn.textContent = isDark ? '🌙 切换亮色' : '☀️ 切换暗色';
                            }
                        };

                        sidebar.insertBefore(btn, sidebar.firstChild);
                    });
                },
                // Language toggle plugin (with dynamic sidebar loading)
                function(hook, vm) {
                    function getCurrentPath() {
                        const path = window.location.hash.replace(/^#\//, '');
                        if (!path || path === './' || path === '.') return '';
                        return path;
                    }
                    function isEnglishPath(path) {
                        return path.toUpperCase().includes('-EN');
                    }
                    // Expose for dark mode button
                    window.getCurrentPath = getCurrentPath;
                    window.isEnglishPath = isEnglishPath;

                    function switchLang() {
                        const currentPath = getCurrentPath();
                        let newPath;
                        if (isEnglishPath(currentPath)) {
                            // English → Chinese
                            if (currentPath.toUpperCase().startsWith('README-EN')) {
                                newPath = '';
                            } else {
                                newPath = currentPath.replace(/-EN\.md$/i, '.md').replace(/-EN$/, '');
                            }
                        } else {
                            // Chinese → English
                            if (currentPath.toUpperCase() === 'README.MD' || currentPath.toUpperCase() === 'README' || currentPath === '') {
                                newPath = 'README-EN';
                            } else if (currentPath.toUpperCase() === 'CHANGELOG.MD' || currentPath.toUpperCase() === 'CHANGELOG') {
                                newPath = 'CHANGELOG-EN';
                            } else if (currentPath.endsWith('.md')) {
                                newPath = currentPath.slice(0, -3) + '-EN.md';
                            } else {
                                newPath = currentPath + '-EN';
                            }
                        }
                        window.location.hash = '#/' + newPath;
                    }

                    function loadSidebar(isEnglish) {
                        const sidebarFile = isEnglish ? '_sidebar-EN.md' : '_sidebar.md';
                        fetch(sidebarFile).then(function(res) {
                            return res.text();
                        }).then(function(md) {
                            const sidebarNav = document.querySelector('.sidebar-nav');
                            if (!sidebarNav) return;
                            const themeBtn = document.querySelector('.sidebar-toggle-btn-theme');
                            const langBtn = document.querySelector('.sidebar-toggle-btn-lang');
                            const html = vm.compiler ? vm.compiler.sidebar(md) : marked(md);
                            sidebarNav.innerHTML = html;
                            if (langBtn) sidebarNav.insertBefore(langBtn, sidebarNav.firstChild);
                            if (themeBtn) sidebarNav.insertBefore(themeBtn, sidebarNav.firstChild);
                            highlightActive();
                        });
                    }

                    function highlightActive() {
                        const currentPath = getCurrentPath();
                        const links = document.querySelectorAll('.sidebar-nav a');
                        links.forEach(function(link) {
                            const href = link.getAttribute('href') || '';
                            const linkPath = href.replace(/^#\//, '').replace(/^\.\//,'');
                            link.parentElement.classList.remove('active');
                            if (linkPath && currentPath.includes(linkPath.replace('./', ''))) {
                                link.parentElement.classList.add('active');
                            }
                        });
                    }

                    hook.doneEach(function() {
                        const sidebar = document.querySelector('.sidebar-nav');
                        if (!sidebar) return;

                        let langBtn = document.querySelector('.sidebar-toggle-btn-lang');
                        if (!langBtn) {
                            langBtn = document.createElement('div');
                            langBtn.className = 'sidebar-toggle-btn sidebar-toggle-btn-lang';
                            langBtn.onclick = switchLang;
                            const themeBtn = document.querySelector('.sidebar-toggle-btn-theme');
                            if (themeBtn && themeBtn.nextSibling) {
                                sidebar.insertBefore(langBtn, themeBtn.nextSibling);
                            } else {
                                sidebar.insertBefore(langBtn, sidebar.firstChild);
                            }
                        }

                        const path = getCurrentPath();
                        const isEnglish = isEnglishPath(path);
                        langBtn.textContent = isEnglish ? '🌐 中文' : '🌐 English';

                        // Update dark mode button text based on language
                        const themeBtn = document.querySelector('.sidebar-toggle-btn-theme');
                        if (themeBtn) {
                            const isDark = document.body.classList.contains('dark-mode');
                            if (isEnglish) {
                                themeBtn.textContent = isDark ? '🌙 Light Mode' : '☀️ Dark Mode';
                            } else {
                                themeBtn.textContent = isDark ? '🌙 切换亮色' : '☀️ 切换暗色';
                            }
                        }

                        // Update pagination text based on language
                        if (window.$docsify && window.$docsify.pagination) {
                            window.$docsify.pagination.previousText = isEnglish ? 'Previous' : '上一章节';
                            window.$docsify.pagination.nextText = isEnglish ? 'Next' : '下一章节';
                        }

                        loadSidebar(isEnglish);
                    });
                }
            ]
        }
    </script>
    <!-- Docsify Core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@latest/lib/docsify.min.js"></script>
    <!-- Mermaid -->
    <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.min.js"></script>
    <!-- Code Highlighting -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-swift.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-objectivec.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-ruby.js"></script>
    <!-- Pagination -->
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
    <!-- Copy Code -->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
    <!-- Image Zoom -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <!-- External Script -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/external-script.min.js"></script>
    <!-- Word Count -->
    <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
    <!-- Search -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>

</html>
